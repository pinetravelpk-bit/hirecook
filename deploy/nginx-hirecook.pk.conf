# HireCook.pk — Next.js app on 127.0.0.1:3104 (systemd: hirecook.service)
upstream hirecook_app {
    server 127.0.0.1:3104;
    keepalive 16;
}

server {
    server_name hirecook.pk www.hirecook.pk;

    if ($host = www.hirecook.pk) { return 301 https://hirecook.pk$request_uri; }

    client_max_body_size 2m;
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json text/plain application/xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://hirecook_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://hirecook_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hirecook.pk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hirecook.pk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.hirecook.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hirecook.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name hirecook.pk www.hirecook.pk;
    return 404; # managed by Certbot




}