# HireCook.pk — Next.js app on 127.0.0.1:3104 (systemd: hirecook.service)
upstream hirecook_app {
    server 127.0.0.1:3104;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hirecook.pk www.hirecook.pk;

    client_max_body_size 2m;
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json text/plain application/xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://hirecook_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://hirecook_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
